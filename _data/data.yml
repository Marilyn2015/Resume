career-profile:
title: Professional Profile
summary: |
Computer Systems Analyst and cybersecurity professional supporting United States Air Force operations in secure DoD environments. Experience spans mission systems, secure data processing, systems administration, communications, cybersecurity, virtualization, and technical troubleshooting across Air Force and Navy environments.

CompTIA CySA+, Security+, and A+ certified with an active security clearance. Experienced in environments where system availability, data integrity, security controls, and operational accuracy are critical. Technical background includes mission-data systems, cryptographic key updates, system hardening, VMware virtualization, CAC authentication, remote support, and classified-system operations.

Beyond my professional systems work, I design and develop privacy-focused software using React, Firebase, Python, FastAPI, WebAuthn/passkeys, biometric verification, and zero-knowledge technologies.

