experiences:
title: "Professional Experience"
info:
- role: "Computer Systems Analyst"
time: "Sep 2023-Feb 2024; Mar 2024-Present"
company: "TDX Combat Training Systems | Newport News, VA"
details: |
Support mission systems used during live United States Air Force flight operations and post-flight debriefing in secure DoD environments.

    Securely process and transfer mission data using SIS and PCDS to support real-time flight visualization and accurate post-mission debriefing.

    Support LMOC operations, radio communications, and classified systems and data within SAPF environments.

    Perform monthly cryptographic key updates with hands-on experience supporting Link 16 key loading, system patching, updates, troubleshooting, and security hardening.

    Contributed to TEMPEST documentation and facility transition activities involving secure-system requirements.

    Work with PCDS, ANGEL, ICADS, SolarWinds, MSCT, VMware, and Horizon environments.

- role: "Virtualization & Storage Technician"
  time: "Feb 2024-Mar 2024"
  company: "Fusion Mastech"
  details: |
    Monitored virtual machines supporting multiple military installations and identified system errors and operational issues.

    Performed basic VM troubleshooting, controlled shutdowns when required, documented incidents, and submitted tickets for issues requiring additional technical support.

    Gained hands-on experience with VMware and VMware ESXi environments.

- role: "Technical Support"
  time: "Feb 2022"
  company: "SAIC"
  details: |
    Provided technical support for United States Navy users across authentication, communications, email, and workstation environments.

    Troubleshot CAC certificate and authentication issues, Microsoft Teams, Microsoft Exchange, and Flank Speed email.

    Used MEMC and remote-access tools to connect to user systems, diagnose technical problems, and restore functionality.

- role: "Owner"
  time: "Aug 2013-Aug 2023"
  company: "Virginia Natural Cleaning Solutions | Hampton, VA"
  details: |
    Founded and operated Virginia Natural Cleaning Solutions, managing customers, marketing, finances, vendors, inventory, bookkeeping, and day-to-day operations.

    Established the company as a certified SWaM vendor and secured multiple HUD contracts.

    Grew the business from one or two initial clients into an established operation within 18 months.

- role: "Lead Leasing Consultant"
  time: "Nov 2017-Feb 2022"
  company: "SL Nusbaum Realty Co. | Newport News, VA"
  details: |
    Managed leasing, applications, compliance documentation, inspections, resident issues, and prospective-resident follow-up.

    Increased property occupancy from 87% to 96% within two months and was promoted to Lead Leasing Consultant.

projects:
title: "Technical Projects"
intro: >
Independent engineering work focused on secure digital identity, privacy-preserving authentication, human verification, and full-stack application development.

assignments:
- title: "HumanKey / Hash Humanity"
link: "https://hashhumanity.world"
tagline: >
I designed and built HumanKey, the proof-of-person technology behind Hash Humanity. HumanKey uses AWS biometric technology for enrollment and liveness verification, duplicate-person detection, passkeys/WebAuthn, and zero-knowledge technology to support one human per account while limiting exposure of personal identity. I developed the supporting architecture and backend using Python and FastAPI and handle privacy and security design, testing, troubleshooting, integration, and deployment. HumanKey is integrated into Hash Humanity, a React and Firebase social platform with real-time data, messaging, notifications, media sharing, multilingual support, cloud functions, and PWA functionality.

