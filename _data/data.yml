career-profile:
title: "Professional Profile"
summary: |
Computer Systems Analyst and cybersecurity professional currently supporting United States Air Force operations in a secure DoD environment. My experience includes mission systems, secure data processing, systems administration, communications, cybersecurity, virtualization, and technical troubleshooting across Air Force and Navy environments.

I hold CompTIA CySA+, Security+, and A+ certifications and an active security clearance. My background combines hands-on operational support with secure systems work in environments where data integrity, reliability, security, and accuracy are critical.

In addition to my professional systems work, I design and develop privacy-focused software using React, Firebase, Python, FastAPI, biometric verification, passkeys/WebAuthn, and zero-knowledge technology.

