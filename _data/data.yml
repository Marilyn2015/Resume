experiences:
title: Professional Experience
info:
- role: Computer Systems Analyst
time: Sep 2023–Feb 2024 | Mar 2024–Present
company: TDX Combat Training Systems | Newport News, VA
details: |
Support mission-critical systems used during live United States Air Force flight operations and post-flight debriefing within secure DoD environments.

    Securely process and transfer mission data through SIS and PCDS to support real-time flight visualization and accurate post-mission debriefing.

    Support LMOC operations, radio communications, and classified systems and data within SAPF environments.

    Perform monthly cryptographic key updates and provide hands-on support for Link 16 key loading, system patching, updates, troubleshooting, and security hardening.

    Contributed to TEMPEST documentation and facility-transition activities involving secure-system requirements.

    Provide operational support across PCDS, ANGEL, ICADS, SolarWinds, MSCT, VMware, and Horizon environments.

- role: Virtualization & Storage Technician
  time: Feb 2024–Mar 2024
  company: Fusion Mastech
  details: |
    Monitored virtualized infrastructure supporting multiple military installations, identifying system errors and operational issues affecting virtual machines.

    Performed initial troubleshooting, controlled VM shutdowns, incident documentation, and escalation of issues requiring additional technical support.

    Developed hands-on familiarity with VMware virtualization and VMware ESXi environments.

- role: Technical Support
  time: Feb 2022
  company: SAIC
  details: |
    Provided technical support to United States Navy users across authentication, communications, email, and workstation environments.

    Diagnosed and resolved CAC certificate and authentication problems, Microsoft Teams issues, Microsoft Exchange problems, and Flank Speed email incidents.

    Used MEMC and remote-access tools to connect to user systems, diagnose technical problems, and restore functionality.

- role: Owner
  time: Aug 2013–Aug 2023
  company: Virginia Natural Cleaning Solutions | Hampton, VA
  details: |
    Founded and operated Virginia Natural Cleaning Solutions, managing client acquisition, service delivery, finances, vendors, inventory, marketing, and bookkeeping.

    Established the company as a certified SWaM vendor and secured multiple HUD contracts.

    Grew the business from an initial client base into an established operation within 18 months.

- role: Lead Leasing Consultant
  time: Nov 2017–Feb 2022
  company: SL Nusbaum Realty Co. | Newport News, VA
  details: |
    Managed leasing operations, applications, compliance documentation, property inspections, resident issues, and prospective-resident follow-up.

    Increased property occupancy from 87% to 96% within two months.

    Promoted to Lead Leasing Consultant based on performance and operational responsibility.

projects:
title: Technical Projects
intro: >
Independent engineering work focused on secure digital identity, privacy-preserving authentication, human verification, and full-stack application development.

assignments:
- title: HumanKey / Hash Humanity
link: "https://hashhumanity.world"
tagline: >
Founder and developer of HumanKey and Hash Humanity. HumanKey is a proof-of-person system designed to support one human per account while minimizing exposure of personal identity. The architecture combines AWS biometric technology for enrollment and liveness verification with duplicate-person detection, passkeys/WebAuthn, and zero-knowledge technology. I designed the supporting architecture and developed backend components using Python and FastAPI while handling privacy and security design, integration, testing, troubleshooting, and deployment. HumanKey is integrated into Hash Humanity, a full-stack React and Firebase social platform featuring real-time data, messaging, notifications, media sharing, multilingual functionality, cloud functions, and PWA support.

