experiences:
title: Experience
info:
- role: Computer System Analyst
time: Sep 2023–Feb 2024; Mar 2024–Present
company: TDX Combat Training Systems | Newport News, VA
details: |
I support mission systems used during live flight operations and post-flight debriefing, securely processing and transferring mission data using SIS and PCDS to create a real-time view of the flight for debriefing. I support LMOC operations and radio communications and work in SAPF environments supporting classified systems and data.

    My work includes monthly cryptographic key updates with basic hands-on experience in Link 16 key loading, system patching, updates, troubleshooting, and security hardening. I contributed to our TEMPEST package and facility transition and have basic hands-on experience with VMware and Horizon. I regularly work with PCDS, ANGEL, ICADS, SolarWinds, and MSCT.

- role: Virtualization & Storage Technician
  time: Feb 2024–Mar 2024
  company: Fusion Mastech
  details: |
    I monitored virtual machines supporting multiple military installations, watched for system errors, troubleshot basic VM issues, performed controlled shutdowns when needed, and submitted tickets for problems requiring additional support. I gained hands-on familiarity with VMware and VMware ESXi.

- role: Technical Support
  time: Feb 2022
  company: SAIC
  details: |
    I provided technical support for Navy users, troubleshooting CAC certificate and authentication issues, Microsoft Teams, Microsoft Exchange, and Flank Speed email. I used MEMC and remote access to log into user systems, troubleshoot problems, and resolve issues.

- role: Owner
  time: Aug 2013–Aug 2023
  company: Virginia Natural Cleaning Solutions | Hampton, VA
  details: |
    I built Virginia Natural Cleaning Solutions from the ground up and managed the day-to-day business, including customers, marketing, finances, vendors, inventory, and bookkeeping. The company became a certified SWaM vendor, secured multiple HUD contracts, and grew from one or two clients into an established business within 18 months.

- role: Lead Leasing Consultant
  time: Nov 2017–Feb 2022
  company: SL Nusbaum Realty Co. | Newport News, VA
  details: |
    I managed leasing, applications, compliance, inspections, resident issues, and lead follow-up. I increased occupancy from 87% to 96% in two months and was promoted to Lead Leasing Consultant.

projects:
title: Projects
intro: >
Selected technical work focused on secure identity, privacy, cybersecurity, and full-stack application development.

assignments:
- title: HumanKey / Hash Humanity
link: "https://hashhumanity.world"
tagline: "I designed and built HumanKey, the proof-of-person technology behind Hash Humanity. HumanKey uses AWS biometric technology for enrollment and liveness verification, along with duplicate-person detection, passkeys/WebAuthn, and zero-knowledge technology to support one human per account while limiting exposure of personal identity. I developed the supporting architecture and backend using Python and FastAPI and handle privacy and security design, testing, troubleshooting, integration, and deployment. HumanKey is integrated into Hash Humanity, a React and Firebase social platform with real-time data, messaging, notifications, media sharing, multilingual support, cloud functions, and PWA functionality."

