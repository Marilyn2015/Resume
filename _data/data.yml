career-profile:
title: Professional Summary
summary: |
I’m a Computer System Analyst and cybersecurity professional currently supporting United States Air Force operations in a DoD environment. My work includes mission systems, secure data processing, system administration, communications, cybersecurity, and troubleshooting in classified environments. My background also includes Navy technical support and virtualization, giving me experience across both end-user and mission-focused systems.

I hold CompTIA CySA+, Security+, and A+ certifications and an active security clearance. I’ve built my career by learning hands-on, taking on increasingly technical work, and solving problems in environments where security, accuracy, and reliability matter.

